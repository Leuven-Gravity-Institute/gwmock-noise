[default]
extend-ignore-re = [
  # === Block ignore: typos:off → typos:on ===
  # Supports:
  #   <!-- typos:off -->   ...   <!-- typos:on -->
  #   # typos:off          ...   # typos:on
  #   // typos:off         ...   // typos:on
  #   /* typos:off */      ...   /* typos:on */
  "(?s)(<!--|#|//|/\\*)\\s*typos:off.*?\\n\\s*(<!--|#|//|\\*/)\\s*typos:on",

  # === Single-line ignore ===
  # Example: some text with intentional typo  <!-- typos:disable-line -->
  # or: some text with intentional typo  # typos:disable-line
  "(?Rm)^.*(<!--|#|//)\\s*typos:disable-line\\s*.*?(-->)?$",

  # === Ignore next line ===
  # <!-- typos:ignore-next-line -->
  # next line with potential false positive
  "(<!--|#|//)\\s*typos:ignore-next-line\\s*.*?(-->)?\\n.*",
]

[default.extend-words]
"arange" = "arange"
# Gravitational-wave jargon: the analysed time a search or a detector actually accumulated,
# as distinct from the calendar span it was accumulated over. Not "lifetime".
"livetime" = "livetime"
