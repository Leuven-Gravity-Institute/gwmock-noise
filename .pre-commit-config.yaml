repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
            # Bundled detector PSD tables are deliberate, individually reviewed data
            # assets documented in src/gwmock_noise/data/psd/PROVENANCE.md. A measured
            # O3 spectrum on its native 0.25 Hz grid is ~1 MB. The 500 KB guard against
            # accidental blobs still applies everywhere else in the tree.
            exclude: ^src/gwmock_noise/data/psd/
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: check-symlinks
          - id: check-yaml
          - id: check-toml
          - id: debug-statements
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: trailing-whitespace
          - id: check-docstring-first
          - id: check-json

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.7
      hooks:
          - id: ruff-check
            args: [--fix, --config=pyproject.toml]
          - id: ruff-format

    - repo: https://github.com/crate-ci/typos
      rev: v1.50.1
      hooks:
          - id: typos
            args: []

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.6
      hooks:
          - id: prettier

    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.2
      hooks:
          - id: markdownlint-cli2
            args:
                - --config
                - .markdownlint.yaml

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint

    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.12.14
      hooks:
          # Update the uv lockfile
          - id: uv-lock

    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.1
      hooks:
          - id: gitleaks
